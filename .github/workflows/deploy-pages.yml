name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita que corra el workflow de Jekyll por defecto en paralelo
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: Frontend
        env:
          GITHUB_PAGES: 'true'
        run: npm run build:pages

      # Imprescindible: sin esto GitHub intenta compilar con Jekyll y falla
      - name: Disable Jekyll processing
        run: touch Frontend/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: actualizar sitio desde main'
